services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ecomapa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecomapa
      POSTGRES_PASSWORD: ecomapa_dev
      POSTGRES_DB: ecomapa
    ports:
      - "5432:5432"
    volumes:
      - ecomapa-pgdata:/var/lib/postgresql/data
volumes:
  ecomapa-pgdata:
